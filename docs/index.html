<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101d31" />
  <meta name="description" content="보안 지식이 없어도 프로젝트 분석부터 보안 서류 작성, 전문가 검토, 제출 관리까지. 보안길잡이 AI 인터랙티브 시연 프로토타입." />
  <title>보안길잡이 AI — 공공 보안업무 협업 에이전트</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./org-settings.css" />
</head>
<body>
  <div class="site-shell">
    <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M13 2.5 22 6v7.7c0 5-3.7 8-9 9.9-5.3-1.9-9-4.9-9-9.9V6l9-3.5Z" stroke="currentColor" stroke-width="2.1"/><path d="m9.2 12.8 2.5 2.6 5.1-5.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">보안길잡이<span>AI</span><small>SECURITY WORKFLOW COPILOT</small></span>
      </div>
      <div class="institution-control"><label for="institution-switch"><span class="workspace-dot"></span> 신청 기관 · 예시 설정</label><select id="institution-switch" aria-label="신청 기관 선택"></select></div>
      <div class="sidebar-section-label">WORKSPACE</div>
      <nav class="side-nav" id="side-nav" aria-label="서비스 시연 단계"></nav>
      <div class="sidebar-grow"></div>
      <div class="sidebar-insight">
        <div class="insight-icon">✦</div>
        <b>한 번의 프로젝트 입력으로</b>
        <p>서류 작성부터 보완 요청, 검토 이력까지 하나의 흐름으로.</p>
      </div>
      <div class="sidebar-footer"><span class="live-dot"></span> Interactive prototype <span>v0.2</span></div>
    </aside>

    <div class="workspace-main">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu" id="mobile-menu" aria-label="메뉴 열기">☰</button><span id="breadcrumb">워크스페이스 / 서비스 소개</span></div>
        <div class="topbar-right">
          <span class="demo-badge"><span class="demo-dot"></span> LIVE DEMO</span>
          <button class="icon-text-button" id="reset-demo" title="시연 상태 초기화">↻ <span>초기화</span></button>
          <span class="avatar">팀</span>
        </div>
      </header>
      <main class="content" id="app" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-region" aria-live="polite" id="toast-region"></div>
  <script src="./config-engine.js" defer></script>
  <script src="./admin-ui.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
